<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Flappy Bird - Moderne</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0f0f1a;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    font-family: 'Nunito', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #phoneFrame {
    position: relative;
    width: min(100vw, 420px);
    height: min(100vh, 820px);
    max-height: 100vh;
    aspect-ratio: 9 / 19.5;
    background: #000;
    border-radius: 24px;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #ui {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
  }
  #scoreDisplay {
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 56px;
    font-weight: 800;
    color: white;
    text-shadow: 0 4px 12px rgba(0,0,0,0.5);
    letter-spacing: 2px;
    display: none;
  }
  #menu {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: auto;
    background: rgba(20, 20, 40, 0.85);
    backdrop-filter: blur(12px);
    padding: 40px 50px;
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    min-width: 320px;
  }
  #menu h1 {
    color: #fff;
    font-size: 42px;
    font-weight: 800;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #f4d03f, #e67e22);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  #menu p {
    color: rgba(255,255,255,0.7);
    margin-bottom: 28px;
    font-size: 16px;
  }
  .diff-btn {
    display: block;
    width: 100%;
    padding: 16px 24px;
    margin: 10px 0;
    border: none;
    border-radius: 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    color: white;
  }
  .diff-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
  }
  .diff-btn:active {
    transform: translateY(0);
  }
  #easy { background: linear-gradient(135deg, #2ecc71, #27ae60); }
  #normal { background: linear-gradient(135deg, #3498db, #2980b9); }
  #hard { background: linear-gradient(135deg, #e74c3c, #c0392b); }
  #gameOver {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: auto;
    background: rgba(20, 20, 40, 0.9);
    backdrop-filter: blur(12px);
    padding: 40px 50px;
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: none;
  }
  #gameOver h2 {
    color: #e74c3c;
    font-size: 36px;
    margin-bottom: 10px;
  }
  #gameOver .scores {
    color: white;
    font-size: 20px;
    margin: 16px 0 24px;
    line-height: 1.6;
  }
  #restartBtn, #menuBtn {
    padding: 14px 32px;
    border: none;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #1a1a2e;
    cursor: pointer;
    transition: all 0.2s;
    margin: 6px;
  }
  #restartBtn {
    background: linear-gradient(135deg, #f4d03f, #e67e22);
  }
  #menuBtn {
    background: linear-gradient(135deg, #636e72, #2d3436);
    color: white;
  }
  #restartBtn:hover, #menuBtn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>
<div id="phoneFrame">
<canvas id="gameCanvas"></canvas>
<div id="ui">
  <div id="scoreDisplay">0</div>
  <div id="menu">
    <h1>Flappy Bird</h1>
    <p>Choisis un niveau ou multijoueur</p>
    <button class="diff-btn" id="easy" onclick="initGame('easy')">🟢 Facile</button>
    <button class="diff-btn" id="normal" onclick="initGame('normal')">🔵 Normal</button>
    <button class="diff-btn" id="hard" onclick="initGame('hard')">🔴 Difficile</button>
    <button class="diff-btn" id="multiBtn" style="background: linear-gradient(135deg, #a29bfe, #6c5ce7);">👥 Multijoueur</button>
  </div>
  <div id="multiMenu" style="display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(20,20,40,0.9); padding:25px; border-radius:20px; text-align:center; pointer-events:auto; z-index:25; width:90%; max-width:340px;">
    <h2 style="color:white; margin-bottom:10px; font-size:20px;">Multijoueur (Max 8)</h2>
    
    <input id="pseudoInput" placeholder="Ton Pseudo" maxlength="12" oninput="savePseudo(this.value)" style="padding:8px; margin:4px 0 10px 0; border-radius:8px; border:none; width:100%; font-size:16px; text-align:center; font-weight:700;">

    <button class="diff-btn" onclick="hostGame()" style="background:#2ecc71; padding:12px; margin:6px 0;">Héberger une partie</button>
    <div id="roomCodeDisplay" style="color:#f4d03f; font-size:18px; margin:6px 0; display:none;"></div>
    <input id="joinCodeInput" placeholder="Code de la partie" style="padding:8px; margin:6px 0; border-radius:8px; border:none; width:100%; font-size:16px; text-align:center; text-transform:uppercase;">
    <button class="diff-btn" onclick="joinGame()" style="background:#3498db; padding:12px; margin:6px 0;">Rejoindre</button>
    <button class="diff-btn" onclick="backToMainMenu()" style="background:#636e72; padding:10px; margin-top:8px;">Retour</button>
    
    <div style="margin-top:10px; max-height:100px; overflow-y:auto; background:rgba(0,0,0,0.3); border-radius:8px; padding:6px;">
      <p style="color:#aaa; font-size:12px; margin-bottom:4px;">Joueurs dans le salon :</p>
      <ul id="playersNamesList" style="color:white; font-size:13px; list-style-type:none; padding:0;"></ul>
    </div>

    <div id="startButtons" style="margin-top:10px; display:none;">
      <p style="color:#f4d03f; font-size:12px; margin-bottom:4px;">Lancer la partie :</p>
      <div style="display:flex; gap:4px; justify-content:center;">
        <button class="diff-btn" onclick="startMultiGame('easy')" style="padding:8px; font-size:13px; background:#2ecc71; margin:0;">Facile</button>
        <button class="diff-btn" onclick="startMultiGame('normal')" style="padding:8px; font-size:13px; background:#3498db; margin:0;">Normal</button>
        <button class="diff-btn" onclick="startMultiGame('hard')" style="padding:8px; font-size:13px; background:#e74c3c; margin:0;">Difficile</button>
      </div>
    </div>
  </div>
  <div id="gameOver">
    <h2>Game Over</h2>
    <div class="scores">
      Score : <span id="finalScore">0</span><br>
      Meilleur : <span id="bestScoreDisplay">0</span>
    </div>
    <button id="restartBtn" onclick="restart()" style="margin: 8px;">🔄 Rejouer</button>
    <button id="menuBtn" onclick="goToMenu()" style="margin: 8px; background: linear-gradient(135deg, #636e72, #2d3436);">🏠 Menu</button>
  </div>
</div>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreDisplay = document.getElementById('scoreDisplay');
const menu = document.getElementById('menu');
const gameOverDiv = document.getElementById('gameOver');
const finalScoreEl = document.getElementById('finalScore');
const bestScoreDisplay = document.getElementById('bestScoreDisplay');

let width, height;
let bird, pipes, score, bestScore, gameState, frameCount;
let gravity, flapPower, pipeSpeed, pipeGap, pipeWidth, birdRadius;
let currentDifficulty = 'normal';
let particles = [];
let clouds = [];
let lastTopHeight = null;
let pipeSpawnCounter = 0;

let myPseudo = localStorage.getItem('flappyPseudo') || 'Joueur';
document.addEventListener("DOMContentLoaded", () => {
  const pseudoInputEl = document.getElementById('pseudoInput');
  if (pseudoInputEl) pseudoInputEl.value = myPseudo;
});

function savePseudo(val) {
  myPseudo = val.trim() || 'Joueur';
  localStorage.setItem('flappyPseudo', myPseudo);
}

function getBestScore(diff) {
  return parseInt(localStorage.getItem('flappyBest_' + diff) || '0');
}

function setBestScore(diff, score) {
  localStorage.setItem('flappyBest_' + diff, score);
}

function updateMenuScores() {
  const easyBtn = document.getElementById('easy');
  const normalBtn = document.getElementById('normal');
  const hardBtn = document.getElementById('hard');
  if (easyBtn) easyBtn.innerHTML = '🟢 Facile <span style="font-size:14px;opacity:0.75">(' + getBestScore('easy') + ')</span>';
  if (normalBtn) normalBtn.innerHTML = '🔵 Normal <span style="font-size:14px;opacity:0.75">(' + getBestScore('normal') + ')</span>';
  if (hardBtn) hardBtn.innerHTML = '🔴 Difficile <span style="font-size:14px;opacity:0.75">(' + getBestScore('hard') + ')</span>';
}

const difficulties = {
  easy: { speedMult: 0.72, gapMult: 1.35, gravityMult: 0.95, name: 'Facile' },
  normal: { speedMult: 1.0, gapMult: 1.15, gravityMult: 1.15, name: 'Normal' },
  hard: { speedMult: 1.30, gapMult: 1.0, gravityMult: 1.35, name: 'Difficile' }
};

function resize() {
  const frame = document.getElementById('phoneFrame');
  width = frame.clientWidth;
  height = frame.clientHeight;
  canvas.width = width;
  canvas.height = height;
  
  birdRadius = Math.min(width, height) * 0.028;
  pipeWidth = Math.min(width, height) * 0.09;
  pipeGap = Math.min(width, height) * 0.30;
  
  gravity = height * 0.00052;
  flapPower = -height * 0.0076;
  pipeSpeed = width * 0.005;
  
  if (bird) {
    bird.radius = birdRadius;
    bird.x = width * 0.22;
  }
}

function initGame(diff = 'normal') {
  try {
    currentDifficulty = diff;
    bestScore = getBestScore(diff);
    
    const d = difficulties[diff];
    bird = {
      x: width * 0.22,
      y: height * 0.45,
      vy: 0,
      radius: birdRadius,
      rotation: 0,
      wingAngle: 0
    };
    pipes = [];
    score = 0;
    frameCount = 0;
    particles = [];
    lastTopHeight = null;
    pipeSpawnCounter = 0;
    gameState = 'play';
    
    gravity = height * 0.00052 * d.gravityMult;
    flapPower = -height * 0.0076;
    pipeSpeed = width * 0.005 * d.speedMult;
    pipeGap = Math.min(width, height) * 0.30 * d.gapMult;
    
    scoreDisplay.style.display = 'block';
    menu.style.display = 'none';
    document.getElementById('multiMenu').style.display = 'none';
    gameOverDiv.style.display = 'none';
    
    const waitMsg = document.getElementById('waitingMsg');
    if (waitMsg) waitMsg.remove();
    const rankEl = document.getElementById('roundRankingModal');
    if (rankEl) rankEl.remove();

    updateScore();
    
    clouds = [];
    for (let i = 0; i < 6; i++) {
      clouds.push({
        x: Math.random() * width,
        y: Math.random() * height * 0.4,
        size: 40 + Math.random() * 50,
        speed: 0.3 + Math.random() * 0.5
      });
    }
  } catch (err) {
    console.error('Erreur initGame:', err);
  }
}

function updateScore() {
  scoreDisplay.textContent = score;
}

let lastFlap = 0;
function flap() {
  if (gameState !== 'play') return;
  const now = performance.now();
  if (now - lastFlap < 80) return;
  lastFlap = now;
  bird.vy = flapPower;
  
  for (let i = 0; i < 6; i++) {
    particles.push({
      x: bird.x - 10,
      y: bird.y,
      vx: -2 - Math.random() * 2,
      vy: (Math.random() - 0.5) * 3,
      life: 1,
      size: 3 + Math.random() * 4
    });
  }
}

function restart() {
  initGame(currentDifficulty);
}

function goToMenu() {
  gameState = 'menu';
  bird = null;
  pipes = [];
  particles = [];
  scoreDisplay.style.display = 'none';
  gameOverDiv.style.display = 'none';
  menu.style.display = 'block';
  const waitMsg = document.getElementById('waitingMsg');
  if (waitMsg) waitMsg.remove();
  const rankEl = document.getElementById('roundRankingModal');
  if (rankEl) rankEl.remove();
  updateMenuScores();
}

function spawnPipe(topHeight = null) {
  const minTop = height * 0.12;
  const maxTop = height - pipeGap - height * 0.15;
  
  let tHeight;
  if (topHeight !== null) {
    tHeight = topHeight;
  } else {
    pipeSpawnCounter++;
    if (lastTopHeight === null) {
      tHeight = minTop + Math.random() * Math.max(50, maxTop - minTop);
    } else {
      // Variation strictement bridée pour garantir qu'un saut ou une descente est toujours réalisable physiquement entre 2 tuyaux
      const maxDelta = height * 0.13; 
      let delta = (Math.random() - 0.5) * (maxDelta * 2);
      
      // Enchaînement dynamique non linéaire tous les 3 tuyaux (alternance fluide haut/bas)
      if (pipeSpawnCounter % 3 === 0) {
        delta = (lastTopHeight > height * 0.4 ? -1 : 1) * (height * 0.09 + Math.random() * (height * 0.04));
      }

      tHeight = Math.max(minTop, Math.min(maxTop, lastTopHeight + delta));
    }
    lastTopHeight = tHeight;
  }
  
  pipes.push({
    x: width + 20,
    top: tHeight,
    bottom: tHeight + pipeGap,
    passed: false
  });

  if (multiMode && isHost && topHeight === null) {
    broadcast({
      type: 'spawnPipe',
      top: tHeight
    });
  }
}

function checkCollision() {
  if (!bird) return false;
  if (bird.y + bird.radius > height - 35 || bird.y - bird.radius < 0) return true;
  for (let p of pipes) {
    if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + pipeWidth) {
      if (bird.y - bird.radius < p.top || bird.y + bird.radius > p.bottom) return true;
    }
  }
  return false;
}

function update(delta = 1) {
  if (gameState !== 'play' && !(multiMode && (gameState === 'waiting' || gameState === 'spectate'))) return;

  if (bird && gameState === 'play') {
    bird.vy += gravity * delta;
    bird.y += bird.vy * delta;
    bird.rotation = Math.min(0.8, Math.max(-0.5, bird.vy * 0.08));
    bird.wingAngle += 0.3 * delta;
  }

  frameCount += delta;
  const spawnRate = Math.floor(85 / difficulties[currentDifficulty].speedMult);
  
  if (frameCount >= spawnRate) {
    if (!multiMode || isHost) {
      spawnPipe();
    }
    frameCount -= spawnRate;
  }

  for (let p of pipes) {
    p.x -= pipeSpeed * delta;
    if (bird && !p.passed && p.x + pipeWidth < bird.x && gameState === 'play') {
      p.passed = true;
      score++;
      updateScore();
    }
  }
  pipes = pipes.filter(p => p.x > -pipeWidth - 30);

  particles.forEach(p => {
    p.x += p.vx * delta;
    p.y += p.vy * delta;
    p.life -= 0.03 * delta;
  });
  particles = particles.filter(p => p.life > 0);

  clouds.forEach(c => {
    c.x -= c.speed * delta;
    if (c.x < -c.size * 2) c.x = width + c.size;
  });

  if (gameState === 'play' && checkCollision()) {
    gameOver();
  }
}

function gameOver() {
  if (multiMode) {
    gameState = 'waiting';
    bird = null;
    broadcast({ type: 'playerDied', from: peer ? peer.id : 'local', alive: false, score: score, pseudo: myPseudo });
    
    let waitEl = document.getElementById('waitingMsg');
    if (!waitEl) {
      waitEl = document.createElement('div');
      waitEl.id = 'waitingMsg';
      waitEl.style.cssText = 'position:absolute; top:20px; left:50%; transform:translateX(-50%); color:white; font-size:15px; text-align:center; z-index:25; pointer-events:auto; background:rgba(0,0,0,0.7); padding:10px 16px; border-radius:12px;';
      document.getElementById('ui').appendChild(waitEl);
    }
    waitEl.innerHTML = '💥 Game Over ! En attente de la fin de manche...<br>' +
      '<button onclick="quitMultiGame()" style="margin-top:6px; padding:6px 12px; background:#e74c3c; color:white; border:none; border-radius:6px; font-weight:700; cursor:pointer; pointer-events:auto;">🚪 Quitter la partie</button>';
    
    checkRoundOver();
    return;
  }

  gameState = 'over';
  if (score > bestScore) {
    bestScore = score;
    setBestScore(currentDifficulty, bestScore);
  }
  finalScoreEl.textContent = score;
  bestScoreDisplay.textContent = bestScore;
  scoreDisplay.style.display = 'none';
  gameOverDiv.style.display = 'block';
}

function checkRoundOver() {
  let allDead = (bird === null);
  Object.values(otherBirds).forEach(ob => {
    if (ob.alive !== false) allDead = false;
  });

  if (allDead && isHost) {
    let roundResults = [{ name: myPseudo, score: score }];
    Object.values(otherBirds).forEach(ob => {
      roundResults.push({ name: ob.pseudo || 'Joueur', score: ob.score || 0 });
    });

    roundResults.sort((a, b) => b.score - a.score);

    roundResults.forEach(r => {
      generalScores[r.name] = (generalScores[r.name] || 0) + r.score;
    });

    let generalRanking = Object.entries(generalScores).map(([name, total]) => ({ name, total }));
    generalRanking.sort((a, b) => b.total - a.total);

    const packet = { type: 'roundOver', roundResults, generalRanking };
    broadcast(packet);
    showRoundRanking(roundResults, generalRanking);
  }
}

function showRoundRanking(roundResults, generalRanking) {
  const waitEl = document.getElementById('waitingMsg');
  if (waitEl) waitEl.remove();

  let modal = document.getElementById('roundRankingModal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'roundRankingModal';
    modal.style.cssText = 'position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(20,20,40,0.95); padding:20px; border-radius:20px; text-align:center; z-index:35; color:white; width:90%; max-width:320px; pointer-events:auto; border:1px solid rgba(255,255,255,0.2);';
    document.getElementById('ui').appendChild(modal);
  }

  let html = '<h3 style="color:#f4d03f; margin-bottom:10px; font-size:20px;">📊 Fin de Manche</h3>';
  
  html += '<p style="font-size:14px; font-weight:700; margin-bottom:4px; color:#3498db;">Classement de la Manche :</p>';
  html += '<ul style="list-style:none; padding:0; margin-bottom:12px; font-size:13px; background:rgba(0,0,0,0.3); border-radius:8px; padding:6px;">';
  roundResults.forEach((r, i) => {
    html += '<li style="padding:2px 0;">' + (i === 0 ? '🥇 ' : i === 1 ? '🥈 ' : i === 2 ? '🥉 ' : '👤 ') + r.name + ' : <b>' + r.score + ' pts</b></li>';
  });
  html += '</ul>';

  html += '<p style="font-size:14px; font-weight:700; margin-bottom:4px; color:#2ecc71;">Classement Général Cumulé :</p>';
  html += '<ul style="list-style:none; padding:0; margin-bottom:16px; font-size:13px; background:rgba(0,0,0,0.3); border-radius:8px; padding:6px;">';
  generalRanking.forEach((g, i) => {
    html += '<li style="padding:2px 0;">' + (i === 0 ? '👑 ' : '• ') + g.name + ' : <b>' + g.total + ' pts</b></li>';
  });
  html += '</ul>';

  if (isHost) {
    html += '<button onclick="startMultiGame(currentDifficulty)" style="padding:10px 20px; background:#2ecc71; color:white; border:none; border-radius:8px; font-weight:700; cursor:pointer; margin-right:6px;">Manche Suivante</button>';
  } else {
    html += '<p style="color:#aaa; font-size:12px; margin-bottom:8px;">En attente de l\'hôte pour relancer...</p>';
  }
  html += '<button onclick="quitMultiGame()" style="padding:10px 20px; background:#e74c3c; color:white; border:none; border-radius:8px; font-weight:700; cursor:pointer;">Quitter</button>';

  modal.innerHTML = html;
}

function quitMultiGame() {
  let finalRanking = Object.entries(generalScores).map(([name, total]) => ({ name, total }));
  finalRanking.sort((a, b) => b.total - a.total);

  let modal = document.getElementById('roundRankingModal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'roundRankingModal';
    modal.style.cssText = 'position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(20,20,40,0.95); padding:20px; border-radius:20px; text-align:center; z-index:35; color:white; width:90%; max-width:320px; pointer-events:auto; border:1px solid rgba(255,255,255,0.2);';
    document.getElementById('ui').appendChild(modal);
  }

  let html = '<h3 style="color:#e74c3c; margin-bottom:10px; font-size:20px;">🏆 Bilan Général Définitif</h3>';
  html += '<ul style="list-style:none; padding:0; margin-bottom:16px; font-size:14px; background:rgba(0,0,0,0.3); border-radius:8px; padding:8px;">';
  finalRanking.forEach((g, i) => {
    html += '<li style="padding:3px 0;">' + (i === 0 ? '👑 ' : '• ') + g.name + ' : <b>' + g.total + ' pts</b></li>';
  });
  html += '</ul>';
  html += '<button onclick="backToMainMenu()" style="padding:12px 24px; background:#636e72; color:white; border:none; border-radius:8px; font-weight:700; cursor:pointer;">Retour au Menu</button>';

  modal.innerHTML = html;
  
  if (clientConn && clientConn.open) {
    clientConn.send({ type: 'playerLeft', pseudo: myPseudo });
  }
}

function drawBird(bX, bY, bRot, bWing, bColor, pName = '') {
  ctx.save();
  ctx.translate(bX, bY);
  ctx.rotate(bRot || 0);

  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(5, 8, birdRadius * 0.9, birdRadius * 0.45, 0, 0, Math.PI * 2);
  ctx.fill();

  const bodyGrad = ctx.createRadialGradient(-birdRadius*0.4, -birdRadius*0.4, 2, 0, 0, birdRadius);
  bodyGrad.addColorStop(0, '#fff3a0');
  bodyGrad.addColorStop(0.4, bColor || '#f4d03f');
  bodyGrad.addColorStop(1, '#d4a017');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.ellipse(0, 0, birdRadius, birdRadius * 0.82, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.ellipse(-birdRadius*0.25, -birdRadius*0.35, birdRadius*0.5, birdRadius*0.3, -0.4, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.rotate(Math.sin(bWing || 0) * 0.45);
  ctx.fillStyle = '#e17055';
  ctx.beginPath();
  ctx.ellipse(-7, 5, birdRadius * 0.5, birdRadius * 0.3, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(birdRadius * 0.28, -birdRadius * 0.18, birdRadius * 0.34, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#2d3436';
  ctx.beginPath();
  ctx.arc(birdRadius * 0.4, -birdRadius * 0.16, birdRadius * 0.17, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ff9f43';
  ctx.beginPath();
  ctx.moveTo(birdRadius * 0.65, -3);
  ctx.lineTo(birdRadius * 1.3, -9);
  ctx.lineTo(birdRadius * 1.3, 7);
  ctx.closePath();
  ctx.fill();

  ctx.restore();

  if (pName) {
    ctx.save();
    ctx.fillStyle = 'white';
    ctx.font = 'bold 11px Nunito';
    ctx.textAlign = 'center';
    ctx.fillText(pName, bX, bY - birdRadius - 12);
    ctx.restore();
  }
}

function drawPipes() {
  pipes.forEach(p => {
    const bodyGrad = ctx.createLinearGradient(p.x, 0, p.x + pipeWidth, 0);
    bodyGrad.addColorStop(0, '#007a5a');
    bodyGrad.addColorStop(0.5, '#00d4b8');
    bodyGrad.addColorStop(1, '#006b4f');

    ctx.fillStyle = bodyGrad;
    ctx.fillRect(p.x, 0, pipeWidth, p.top);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(p.x + 2, 0, 8, p.top);

    const capGrad = ctx.createLinearGradient(0, p.top - 36, 0, p.top);
    capGrad.addColorStop(0, '#00f0d0');
    capGrad.addColorStop(1, '#007a5a');
    ctx.fillStyle = capGrad;
    ctx.fillRect(p.x - 12, p.top - 36, pipeWidth + 24, 36);

    ctx.fillStyle = bodyGrad;
    ctx.fillRect(p.x, p.bottom, pipeWidth, height - p.bottom);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(p.x + 2, p.bottom, 8, height - p.bottom);

    ctx.fillStyle = capGrad;
    ctx.fillRect(p.x - 12, p.bottom, pipeWidth + 24, 36);
  });
}

function drawGround() {
  const groundGrad = ctx.createLinearGradient(0, height - 40, 0, height);
  groundGrad.addColorStop(0, '#ffeaa7');
  groundGrad.addColorStop(1, '#fdcb6e');
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, height - 35, width, 35);
  ctx.fillStyle = '#00b894';
  ctx.fillRect(0, height - 38, width, 6);
}

function drawBackground() {
  const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
  skyGrad.addColorStop(0, '#6c5ce7');
  skyGrad.addColorStop(0.4, '#a29bfe');
  skyGrad.addColorStop(0.7, '#74b9ff');
  skyGrad.addColorStop(1, '#81ecec');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, width, height);

  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  clouds.forEach(c => {
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.size * 0.6, 0, Math.PI * 2);
    ctx.arc(c.x + c.size * 0.5, c.y, c.size * 0.8, 0, Math.PI * 2);
    ctx.arc(c.x + c.size, c.y, c.size * 0.55, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = '#ffeaa7';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, width, height);
  
  if (gameState === 'play' || gameState === 'over' || gameState === 'waiting') {
    drawBackground();
    drawPipes();
    drawGround();
    drawParticles();
    
    if (bird && gameState === 'play') {
      drawBird(bird.x, bird.y, bird.rotation, bird.wingAngle, '#f4d03f', myPseudo + ' (Moi)');
    }

    if (multiMode) {
      let activePlayers = [];
      
      if (bird && gameState === 'play') {
        activePlayers.push({ id: peer ? peer.id : 'local', score: score, name: myPseudo });
      }

      Object.entries(otherBirds).forEach(([id, ob]) => {
        if (ob.alive !== false && ob.y) {
          activePlayers.push({ id: id, score: ob.score || 0, name: ob.pseudo || 'Joueur' });
        }
      });

      let leader = null;
      if (activePlayers.length > 0) {
        activePlayers.sort((a, b) => b.score - a.score);
        leader = activePlayers[0];
      }

      if (gameState === 'waiting' && leader) {
        ctx.save();
        ctx.fillStyle = '#f4d03f';
        ctx.font = 'bold 13px Nunito';
        ctx.textAlign = 'center';
        ctx.fillText('👁️ Mode Spectateur : Suivi du Leader (' + leader.name + ')', width / 2, 85);
        ctx.restore();
      }

      Object.entries(otherBirds).forEach(([id, ob], idx) => {
        if (ob.alive === false || !ob.y) return;
        let isLeader = leader && leader.id === id;
        let label = (isLeader ? '👑 ' : '') + (ob.pseudo || 'Joueur');
        drawBird(width * 0.22, ob.y, ob.rotation, ob.wingAngle, birdColors[(idx + 1) % birdColors.length], label);
      });
    }
  }
}

let lastTime = 0;
function loop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const delta = Math.min((timestamp - lastTime) / 16.67, 1.3);
  lastTime = timestamp;

  try {
    update(delta);
    draw();
  } catch (err) {
    console.error('Erreur loop:', err);
  }
  requestAnimationFrame(loop);
}

canvas.addEventListener('pointerdown', () => {
  if (gameState === 'play') flap();
});

document.addEventListener('keydown', (e) => {
  if ((e.code === 'Space' || e.key === ' ') && gameState === 'play') {
    e.preventDefault();
    flap();
  }
});

window.addEventListener('resize', resize);

// ===== MULTIJOUEUR =====
let peer = null;
let connections = [];
let isHost = false;
let roomCode = '';
let otherBirds = {};
let otherPseudos = {};
let multiMode = false;
let clientConn = null;
let generalScores = {};
const birdColors = ['#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6', '#1abc9c', '#e84393', '#00cec9'];

function showMultiMenu() {
  document.getElementById('menu').style.display = 'none';
  document.getElementById('multiMenu').style.display = 'block';
  updatePlayersListUI();
}

function backToMainMenu() {
  document.getElementById('multiMenu').style.display = 'none';
  document.getElementById('menu').style.display = 'block';
  const waitMsg = document.getElementById('waitingMsg');
  if (waitMsg) waitMsg.remove();
  const rankEl = document.getElementById('roundRankingModal');
  if (rankEl) rankEl.remove();
  if (peer) peer.destroy();
  peer = null;
  connections = [];
  otherBirds = {};
  otherPseudos = {};
  generalScores = {};
  multiMode = false;
}

function hostGame() {
  isHost = true;
  multiMode = true;
  roomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
  generalScores = {};

  peer = new Peer('flappy-' + roomCode);

  peer.on('open', () => {
    document.getElementById('roomCodeDisplay').textContent = 'Code : ' + roomCode;
    document.getElementById('roomCodeDisplay').style.display = 'block';
    updatePlayersListUI();
  });

  peer.on('connection', (conn) => {
    if (connections.length >= 7) {
      conn.on('open', () => conn.send({ type: 'error', msg: 'Salon complet (Max 8)' }));
      setTimeout(() => conn.close(), 500);
      return;
    }

    connections.push(conn);
    conn.on('open', () => {
      updatePlayersListUI();
      broadcastRoomList();
    });
    conn.on('data', (data) => {
      if (data.type === 'setPseudo') {
        otherPseudos[conn.peer] = data.pseudo;
        updatePlayersListUI();
        broadcastRoomList();
      }
      if (data.type === 'bird') {
        data.pseudo = otherPseudos[conn.peer] || 'Joueur';
        otherBirds[conn.peer] = data;
      }
      if (data.type === 'playerDied') {
        if (otherBirds[conn.peer]) {
          otherBirds[conn.peer].alive = false;
          otherBirds[conn.peer].score = data.score;
        }
        checkRoundOver();
      }
      if (data.type === 'playerLeft') {
        delete otherBirds[conn.peer];
        delete otherPseudos[conn.peer];
        updatePlayersListUI();
        broadcastRoomList();
      }
    });
    conn.on('close', () => {
      connections = connections.filter(c => c !== conn);
      delete otherBirds[conn.peer];
      delete otherPseudos[conn.peer];
      updatePlayersListUI();
      broadcastRoomList();
    });
  });

  peer.on('error', (err) => alert('Erreur hôte : ' + err.type));
}

function joinGame() {
  const code = document.getElementById('joinCodeInput').value.trim().toUpperCase();
  if (!code) {
    alert('Entre un code de partie');
    return;
  }
  isHost = false;
  multiMode = true;
  generalScores = {};

  peer = new Peer();

  peer.on('open', () => {
    const conn = peer.connect('flappy-' + code);
    connections = [conn];
    clientConn = conn;

    conn.on('open', () => {
      document.getElementById('playersNamesList').innerHTML = '<li>Connecté ! En attente...</li>';
      conn.send({ type: 'setPseudo', pseudo: myPseudo });
    });

    conn.on('data', (data) => {
      if (data.type === 'countdown') {
        const wait = document.getElementById('waitingMsg');
        if (wait) wait.remove();
        const rankEl = document.getElementById('roundRankingModal');
        if (rankEl) rankEl.remove();
        document.getElementById('multiMenu').style.display = 'none';
        menu.style.display = 'none';
        startCountdown(data.seconds, data.diff);
      }
      if (data.type === 'roomList') {
        updateClientPlayersList(data.players);
      }
      if (data.type === 'spawnPipe') {
        spawnPipe(data.top);
      }
      if (data.type === 'bird') {
        otherBirds[data.from] = data;
      }
      if (data.type === 'playerDied') {
        if (otherBirds[data.from]) otherBirds[data.from].alive = false;
      }
      if (data.type === 'roundOver') {
        showRoundRanking(data.roundResults, data.generalRanking);
      }
      if (data.type === 'error') {
        alert(data.msg);
        backToMainMenu();
      }
    });

    conn.on('error', () => alert('Impossible de rejoindre la partie. Vérifie le code.'));
  });
}

function updatePlayersListUI() {
  const listEl = document.getElementById('playersNamesList');
  const startEl = document.getElementById('startButtons');
  if (!listEl) return;

  let html = '<li>👑 ' + myPseudo + ' (Hôte)</li>';
  connections.forEach((conn) => {
    let pName = otherPseudos[conn.peer] || 'Joueur';
    html += '<li>👤 ' + pName + '</li>';
  });
  listEl.innerHTML = html;

  const totalCount = connections.length + 1;
  if (isHost && startEl) {
    startEl.style.display = totalCount >= 1 ? 'block' : 'none';
  }
}

function updateClientPlayersList(playersData) {
  const listEl = document.getElementById('playersNamesList');
  if (!listEl) return;
  let html = '';
  playersData.forEach((p, i) => {
    html += '<li>' + (i === 0 ? '👑 ' : '👤 ') + p + '</li>';
  });
  listEl.innerHTML = html;
}

function broadcastRoomList() {
  if (!isHost) return;
  let playersList = [myPseudo + ' (Hôte)'];
  connections.forEach(conn => {
    playersList.push(otherPseudos[conn.peer] || 'Joueur');
  });
  broadcast({ type: 'roomList', players: playersList });
}

let countdown = 0;
let countdownInterval = null;

function startMultiGame(diff) {
  if (!isHost) return;
  const wait = document.getElementById('waitingMsg');
  if (wait) wait.remove();
  const rankEl = document.getElementById('roundRankingModal');
  if (rankEl) rankEl.remove();
  document.getElementById('multiMenu').style.display = 'none';
  broadcast({ type: 'countdown', seconds: 5, diff: diff });
  startCountdown(5, diff);
}

function startCountdown(seconds, diff) {
  countdown = seconds;
  gameState = 'countdown';
  let cdEl = document.getElementById('countdownDisplay');
  if (!cdEl) {
    const div = document.createElement('div');
    div.id = 'countdownDisplay';
    div.style.cssText = 'position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:80px; font-weight:800; color:#f4d03f; text-shadow:0 4px 20px rgba(0,0,0,0.5); z-index:30; pointer-events:none;';
    document.getElementById('ui').appendChild(div);
    cdEl = div;
  }
  cdEl.style.display = 'block';

  if (countdownInterval) clearInterval(countdownInterval);
  countdownInterval = setInterval(() => {
    countdown--;
    if (countdown > 0) {
      cdEl.textContent = countdown;
    } else {
      cdEl.style.display = 'none';
      clearInterval(countdownInterval);
      initGame(diff);
      if (isHost) {
        broadcast({ type: 'start', diff: diff });
      }
    }
  }, 1000);
  cdEl.textContent = countdown;
}

function broadcast(data) {
  connections.forEach(conn => {
    if (conn && conn.open) {
      try { conn.send(data); } catch (e) { console.warn(e); }
    }
  });
}

const originalUpdate = update;
update = function(delta) {
  originalUpdate(delta);
  if (multiMode && gameState === 'play') {
    const myData = {
      type: 'bird',
      y: bird ? bird.y : -100,
      score: score,
      alive: bird !== null,
      rotation: bird ? bird.rotation : 0,
      wingAngle: bird ? bird.wingAngle : 0,
      pseudo: myPseudo,
      from: peer ? peer.id : 'local'
    };
    broadcast(myData);
  }
};

document.getElementById('multiBtn').addEventListener('click', showMultiMenu);

updateMenuScores();
resize();
requestAnimationFrame(loop);
</script>
